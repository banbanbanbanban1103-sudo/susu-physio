<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SU Physio - Home Service</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* iOS Elastic Scroll Bounce ပြဿနာကို CSS ဖြင့် ဖြေရှင်းခြင်း */
        html, body {
            position: fixed;
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
        }

        header {
            position: absolute;
            top: 0;
            width: 100%;
            height: 80px;
            padding: env(safe-area-inset-top) 20px 0 20px;
            z-index: 10;
            background: #0f172a;
        }

        main {
            position: absolute;
            top: 80px;
            bottom: calc(75px + env(safe-area-inset-bottom));
            left: 0;
            right: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px 20px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(75px + env(safe-area-inset-bottom));
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        /* Checkbox Styling */
        .recurring-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .recurring-box input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #38bdf8;
        }
    </style>
</head>
<body>

    <div id="login-overlay" style="position: fixed; top:0; left:0; width:100%; height:100%; background: #0f172a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div style="text-align: center; width: 80%;">
            <i class="fas fa-user-md" style="font-size: 3rem; color: #38bdf8; margin-bottom: 15px;"></i>
            <h2 style="color: #38bdf8;">SU Physio</h2>
            <p style="color: #94a3b8; margin-bottom: 30px;">စကားဝှက် ရိုက်ထည့်ပါ</p>
            
            <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 30px;">
                <input type="password" id="pass-1" maxlength="1" inputmode="numeric" style="width: 50px; height: 50px; text-align: center; font-size: 1.5rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white;">
                <input type="password" id="pass-2" maxlength="1" inputmode="numeric" style="width: 50px; height: 50px; text-align: center; font-size: 1.5rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white;">
                <input type="password" id="pass-3" maxlength="1" inputmode="numeric" style="width: 50px; height: 50px; text-align: center; font-size: 1.5rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white;">
                <input type="password" id="pass-4" maxlength="1" inputmode="numeric" style="width: 50px; height: 50px; text-align: center; font-size: 1.5rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white;">
            </div>
            <button onclick="checkPasscode()">Unlock</button>
        </div>
    </div>

    <header>
        <h1 style="color: #38bdf8; font-size: 1.5rem;">SU Physio</h1>
        <p style="color: #94a3b8; font-size: 0.8rem;">Home Care Management</p>
    </header>

    <main id="main-content">
        <section id="news" class="active-section">
            <h3><i class="fas fa-chart-line"></i> Today News</h3>
            <div class="card" style="padding: 25px; text-align: center;">
                <span style="font-size: 0.9rem; color: #94a3b8;">ဒီနေ့ လူနာစုစုပေါင်း</span>
                <div id="today-count" style="color: #38bdf8; font-size: 3rem; font-weight: bold; margin: 10px 0;">0</div>
                <span style="font-size: 0.9rem; color: #94a3b8;">ယောက်</span>
            </div>
            
            <div style="margin-top: 25px;">
                <h4 style="margin-bottom: 15px; font-size: 0.9rem;"><i class="fas fa-clock"></i> Next Appointments</h4>
                <div id="next-patient-list"></div>
            </div>
        </section>

        <section id="calendar" style="display:none;">
            <h3><i class="fas fa-calendar-alt"></i> Schedule</h3>
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <button onclick="changeMonth(-1)" style="width: auto; padding: 10px 15px;"><i class="fas fa-chevron-left"></i></button>
                    <h4 id="monthDisplay"></h4>
                    <button onclick="changeMonth(1)" style="width: auto; padding: 10px 15px;"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="weekdays" style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.75rem; color: #94a3b8; margin-bottom: 10px;">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div id="calendarDays" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;"></div>
            </div>
            
            <div id="dayAppointments" class="card" style="display: none; margin-top: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h4 id="selectedDateText" style="color: #38bdf8;"></h4>
                    <button onclick="document.getElementById('dayAppointments').style.display='none'" style="width: auto; padding: 5px 12px;"><i class="fas fa-times"></i></button>
                </div>
                <div id="appointmentList"></div>
            </div>
        </section>

        <section id="booking" style="display:none;">
            <h3><i class="fas fa-user-plus"></i> Patient Booking</h3>
            <form id="booking-form">
                <label>Patient Name</label>
                <input type="text" id="p-name" placeholder="အမည်" required>
                
                <div class="recurring-box">
                    <input type="checkbox" id="p-weekly">
                    <label style="margin: 0; text-transform: none; font-size: 0.9rem; color: #f8fafc;">အပတ်စဉ် ရက်ချိန်းအဖြစ် သတ်မှတ်မည်</label>
                </div>

                <label>Phone Number</label>
                <input type="tel" id="p-phone" placeholder="ဖုန်းနံပါတ်" required>
                <label>Address</label>
                <textarea id="p-address" rows="3" placeholder="လိပ်စာ"></textarea>
                <label>Date & Time</label>
                <input type="datetime-local" id="p-time" required>
                
                <button type="button" onclick="handleBooking()">
                    <i class="fab fa-telegram-plane"></i> Book & Sync Calendar
                </button>
            </form>
        </section>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" id="nav-news" onclick="showSection('news')">
            <i class="fas fa-home"></i><span>News</span>
        </div>
        <div class="nav-item" id="nav-calendar" onclick="showSection('calendar')">
            <i class="fas fa-calendar-day"></i><span>Calendar</span>
        </div>
        <div class="nav-item" id="nav-booking" onclick="showSection('booking')">
            <i class="fas fa-edit"></i><span>Booking</span>
        </div>
    </nav>

    <div id="toast-container"></div>

    <script src="js/app.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/booking.js"></script>
    <script src="js/sheets.js"></script>
    
    <script>
        // iOS Scroll Logic
        const mainContent = document.getElementById('main-content');
        mainContent.addEventListener('touchstart', function() {
            let top = this.scrollTop, totalScroll = this.scrollHeight, currentScroll = top + this.offsetHeight;
            if (top === 0) this.scrollTop = 1;
            else if (currentScroll === totalScroll) this.scrollTop = top - 1;
        });

        // Passcode Input Auto-Focus
        document.querySelectorAll('#login-overlay input').forEach((input, index, inputs) => {
            input.addEventListener('input', () => {
                if (input.value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus();
            });
        });
    </script>
</body>
</html>
