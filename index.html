<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SU Physio - Home Service</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* iOS Elastic Scroll Bounce ပြဿနာကို CSS ဖြင့် ဖြေရှင်းခြင်း */
        html, body {
            position: fixed;
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* ဆရာမ App ၏ Background အရောင် */
        }

        /* Header ကို အငြိမ်ထားရန် */
        header {
            position: absolute;
            top: 0;
            width: 100%;
            height: 80px;
            padding: env(safe-area-inset-top) 20px 0 20px;
            z-index: 10;
            background: #0f172a;
        }

        /* Main Content ကိုပဲ Scroll ပေးလုပ်မည် */
        main {
            position: absolute;
            top: 80px; /* Header အမြင့် */
            bottom: calc(70px + env(safe-area-inset-bottom)); /* Nav အမြင့် + iOS Safe Area */
            left: 0;
            right: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* iOS Scroll ချောမွေ့စေရန် */
            padding: 10px 20px;
        }

        /* Bottom Nav Bar ကို အငြိမ်ထားရန် */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(70px + env(safe-area-inset-bottom));
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        /* Section များ အပြင်ထွက်မသွားစေရန် */
        section {
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="login-overlay" style="position: fixed; top:0; left:0; width:100%; height:100%; background: #0f172a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(20px);">
        <div style="text-align: center; width: 80%;">
            <i class="fas fa-user-md" style="font-size: 3rem; color: var(--accent-blue); margin-bottom: 10px;"></i>
            <h2 style="color: var(--accent-blue); margin-bottom: 10px;">SU Physio</h2>
            <p style="color: var(--text-secondary); margin-bottom: 30px; font-size: 0.9rem;">စကားဝှက် ရိုက်ထည့်ပါ</p>
            
            <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 30px;">
                <input type="password" id="pass-1" maxlength="1" inputmode="numeric" style="width: 50px; height: 50px; text-align: center; font-size: 1.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 10px; color: white;">
                <input type="password" id="pass-2" maxlength="1" inputmode="numeric" style="width: 50px; height: 50px; text-align: center; font-size: 1.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 10px; color: white;">
                <input type="password" id="pass-3" maxlength="1" inputmode="numeric" style="width: 50px; height: 50px; text-align: center; font-size: 1.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 10px; color: white;">
                <input type="password" id="pass-4" maxlength="1" inputmode="numeric" style="width: 50px; height: 50px; text-align: center; font-size: 1.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 10px; color: white;">
            </div>
            
            <button onclick="checkPasscode()" style="width: 150px; border-radius: 25px;">Unlock</button>
        </div>
    </div>

    <header>
        <h1 style="color: var(--accent-blue); font-size: 1.5rem; margin: 0;">SU Physio</h1>
        <p style="color: var(--text-secondary); font-size: 0.8rem; margin: 0;">Home Care Management</p>
    </header>

    <main id="main-content">
        <section id="news" class="active-section">
            <h3><i class="fas fa-chart-line"></i> Today News</h3>
            <div class="card" style="padding: 20px; background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(15, 23, 42, 0));">
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;">
                    <span style="font-size: 0.9rem; color: var(--text-secondary);">ဒီနေ့ လူနာစုစုပေါင်း</span>
                    <span id="today-count" style="color: var(--accent-blue); font-size: 2.5rem; font-weight: bold;">0</span>
                    <span style="font-size: 0.8rem; color: var(--text-secondary);">ယောက်</span>
                </div>
            </div>
            
            <div style="margin-top: 20px;">
                <h4 style="margin-bottom: 10px; font-size: 0.9rem;"><i class="fas fa-clock"></i> Next Appointments</h4>
                <div id="next-patient-list" style="display: flex; flex-direction: column; gap: 10px;">
                    </div>
            </div>
        </section>

        <section id="calendar" style="display:none;">
            <h3><i class="fas fa-calendar-alt"></i> Schedule</h3>
            <div class="calendar-card card">
                <div class="calendar-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <button onclick="changeMonth(-1)" style="width: auto; padding: 5px 15px;"><i class="fas fa-chevron-left"></i></button>
                    <h4 id="monthDisplay">Month Year</h4>
                    <button onclick="changeMonth(1)" style="width: auto; padding: 5px 15px;"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="weekdays" style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 10px;">
                    <div>နေ</div><div>လ</div><div>အင်္ဂါ</div><div>ဗုဒ္ဓ</div><div>ကြာ</div><div>သော</div><div>စနေ</div>
                </div>
                <div id="calendarDays" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;"></div>
            </div>
            
            <div id="dayAppointments" class="card" style="margin-top: 15px; display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h4 id="selectedDateText" style="font-size: 0.9rem; color: var(--accent-blue);">ရက်ချိန်းများ</h4>
                    <button onclick="document.getElementById('dayAppointments').style.display='none'" style="width: auto; padding: 2px 10px;"><i class="fas fa-times"></i></button>
                </div>
                <div id="appointmentList"></div>
            </div>
        </section>

        <section id="booking" style="display:none;">
            <h3><i class="fas fa-user-plus"></i> Patient Booking</h3>
            <div class="search-box" style="margin-bottom: 20px;">
                <input type="text" id="p-search" placeholder="လူနာဟောင်း ရှာရန်..." onkeyup="searchPatient()">
            </div>
            <form id="booking-form">
                <label>Patient Name</label>
                <input type="text" id="p-name" placeholder="အမည်" required>
                <label>Phone Number</label>
                <input type="tel" id="p-phone" placeholder="ဖုန်းနံပါတ်" required>
                <label>Address</label>
                <textarea id="p-address" rows="3" placeholder="လိပ်စာ"></textarea>
                <label>Date & Time</label>
                <input type="datetime-local" id="p-time" required>
                <button type="button" onclick="handleBooking()" style="margin-top: 10px;">
                    <i class="fab fa-telegram-plane"></i> Book & Notify Telegram
                </button>
            </form>
        </section>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" id="nav-news" onclick="showSection('news')">
            <i class="fas fa-home"></i><span>News</span>
        </div>
        <div class="nav-item" id="nav-calendar" onclick="showSection('calendar')">
            <i class="fas fa-calendar-day"></i><span>Calendar</span>
        </div>
        <div class="nav-item" id="nav-booking" onclick="showSection('booking')">
            <i class="fas fa-edit"></i><span>Booking</span>
        </div>
    </nav>

    <script src="js/app.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/booking.js"></script>
    <script src="js/sheets.js"></script>
    
    <script>
        // iOS Scroll Bounce Fix
        document.getElementById('main-content').addEventListener('touchstart', function() {
            let top = this.scrollTop, totalScroll = this.scrollHeight, currentScroll = top + this.offsetHeight;
            if (top === 0) this.scrollTop = 1;
            else if (currentScroll === totalScroll) this.scrollTop = top - 1;
        });

        // PWA Initialization
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }

        // Login inputs
        document.querySelectorAll('#login-overlay input').forEach((input, index, inputs) => {
            input.addEventListener('input', () => {
                if (input.value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus();
            });
        });
    </script>
</body>
</html>
